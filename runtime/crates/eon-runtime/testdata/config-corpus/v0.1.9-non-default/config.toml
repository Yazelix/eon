# Every key v0.1.9 (edge) accepted, set to a value other than its default.
# Unset keys resolve to the eon-runtime test fixture defaults.

[bar]
widgets = ["clock", "cpu"]
ram_warning_percent = 70
ram_critical_percent = 85
cpu_warning_percent = 75
cpu_average_seconds = 60

[terminal]
background_opacity = 0.37
background_blur = false
padding_color = "background"
pane_frames = false
focus_color = "custom:#00ff88"
border_width = 2
focus_border_width = 3
cursor_trail_color = "custom:#ff8800"
cursor_trail_duration = 2.5
font_family = "Iosevka"
font_fallbacks = ["Noto Sans Mono", "Symbols Nerd Font Mono"]
font_size = 13.5
line_height = 1.25
columns = 120
rows = 40

[shell]
command = ["bash", "-l"]
starship = false
zoxide = false
atuin = false
carapace = false
mise = false

[anima]
enabled = false
style = "aquarium"
duration_seconds = 9

[workspace]
warning_close_last_tab = false
animate_working_badge = false

[sidebar]
enabled = false

[agents]
terminal_access = "none"
send_enter_delay_ms = 0

[popups.project]
label = "Projects"
keybinding = "Alt+P"

[popups.git]
command = ["tig"]
label = "Tig"
keybinding = "Alt+Shift+G"
keep_alive = false

[popups.agent]
command = ["claude"]
label = "Claude"
keybinding = "Alt+Shift+C"
keep_alive = false

[popups.anima]
enabled = false

[popups.files]
command = ["eon-yazi"]
label = "Files"
keybinding = "Alt+Shift+F"
keep_alive = false

[popups.retired]
enabled = false
