[package]
name = "eon-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
eon-workspace-protocol = { path = "../eon-workspace-protocol" }
libc = "=0.2.189"
orbit-protocol = { path = "../../../orbit/crates/protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = "=0.6.5"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.18.0", default-features = false, features = ["async-io", "blocking-api"] }
