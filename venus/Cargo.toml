[package]
name = "yazelix-venus"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Private Rune host candidate (eon-yp6vg.7); no package, test or CI root enables it.
# The single switch (eon-yp6vg.54) removes it. See docs/CRATES.md, Rune candidate dependency.
candidate-rune = ["dep:rune"]

[dependencies]
accesskit = "=0.25.2"
accesskit_winit = { version = "=0.34.2", default-features = false, features = ["rwh_06"] }
eon-workspace-protocol = { path = "../runtime/crates/eon-workspace-protocol" }
glyphon = "=0.12.0"
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
orbit-protocol = { path = "../orbit/crates/protocol" }
pollster = { version = "=1.0.1", default-features = false }
# Only `accessibility`, which the chrome needs. Off: embedded-fonts (Venus registers its own),
# dbus and svg (unused), metal-backend and ogg-audio (refused), tooling and frame-profile
# (debug builds keep tooling; frame proofs opt in).
rune = { git = "https://github.com/Yazelix/eon-rune", rev = "caeb04729e1dc378c8fdcbf12a22c333daf30d1d", default-features = false, features = ["accessibility"], optional = true }
serde_json = "=1.0.151"
unicode-script = "=0.5.8"
# `noop` serves the headless renderer tests; wgpu never uses it unless enabled. Here
# rather than in dev-dependencies, so tests reuse the release build's wgpu.
wgpu = { version = "=30.0.1", default-features = false, features = ["noop", "std", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "param", "std", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_winit = { version = "=0.34.2", default-features = false, features = ["accesskit_unix", "async-io"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }
winit = { version = "=0.30.13", default-features = false, features = ["wayland", "wayland-dlopen"] }
wl-clipboard-rs = { version = "=0.9.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
libc = "=0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSProcessInfo", "NSString"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[dev-dependencies]
accesskit_consumer = "=0.39.2"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
