[workspace]
members = [
    "orbit",
    "orbit/crates/protocol",
    "orbit/tools/governance",
    "venus",
    "runtime/crates/eon-runtime",
    "runtime/crates/eon-workspace-protocol",
    "eon/crates/eon",
    "eon/crates/eon-agent",
    "eon/crates/eon-boat",
    "eon/crates/eon-manifest",
    "eon/tools/mac-proof",
    "eon/tools/eon-bench",
    "eon/tools/archive-notices",
    "eon/tools/review-tier",
    "eon/tools/agent-bench",
    "eon/tools/agent-jail",
]
resolver = "3"

[patch.crates-io]
# Required by Venus's optional Rune (candidate-rune graph only): registry parley_engine lacks
# Rune's `line-dictionaries`, and a dependency's own [patch] does not apply here. Moves with the pin.
parley_engine = { git = "https://github.com/Yazelix/eon-rune", rev = "77cc200da9d8ff2491f5a611130b3af082cc21b1" }
winit = { git = "https://github.com/Yazelix/winit-0.30.git", rev = "7c209ec5bebbd2963f75a39f79b320af6b03f72c" }

[profile.release]
lto = "thin"
strip = "debuginfo"
