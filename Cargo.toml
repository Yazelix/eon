[workspace]
members = [
    "orbit",
    "orbit/crates/protocol",
    "orbit/tools/governance",
    "venus",
    "runtime/crates/eon-runtime",
    "runtime/crates/eon-workspace-protocol",
    "eon/crates/eon",
    "eon/crates/eon-manifest",
    "eon/tools/mac-proof",
]
resolver = "3"

[patch.crates-io]
winit = { git = "https://github.com/Yazelix/winit-0.30.git", rev = "7c209ec5bebbd2963f75a39f79b320af6b03f72c" }

[profile.release]
lto = "thin"
strip = "debuginfo"
