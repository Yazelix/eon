[package]
name = "eon"
version = "0.1.29"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
eon-manifest = { path = "../eon-manifest" }
eon-runtime = { path = "../../../runtime/crates/eon-runtime" }
eon-workspace-protocol = { path = "../../../runtime/crates/eon-workspace-protocol" }
libc = "=0.2.189"
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "process", "std", "termios"] }
serde_json = "=1.0.151"

[dev-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["net", "pty"] }
tempfile = "=3.27.0"
rmp = "=0.8.15"
orbit-protocol = { path = "../../../orbit/crates/protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
eon-boat = { path = "../eon-boat" }
rota = { package = "rota-cli", path = "../eon-agent", version = "=0.1.0" }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
