[package]
name = "eon"
version = "0.1.26"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
eon-manifest = { path = "../eon-manifest" }
eon-runtime = { path = "../../../runtime/crates/eon-runtime" }
eon-workspace-protocol = { path = "../../../runtime/crates/eon-workspace-protocol" }
libc = "=0.2.189"
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
rmp = "=0.8.15"
orbit-protocol = { path = "../../../orbit/crates/protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
rota = { package = "eon-agent", path = "../eon-agent" }
