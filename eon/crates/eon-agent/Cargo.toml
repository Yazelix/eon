[package]
name = "rota-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Picks which coding-agent subscription runs your next agent session"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yazelix/eon"
homepage = "https://github.com/Yazelix/eon/blob/edge/eon/crates/eon-agent/README.md"
readme = "README.md"
keywords = ["coding-agent", "llm", "quota", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "config.example.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
publish = ["crates-io"]

[lib]
name = "rota"

[[bin]]
name = "rota"
path = "src/main.rs"

# Tests that need a host with a slot route, and that host, live in test-host/. It is
# outside `include`, so `cargo package` drops these targets and the published tests
# stay whole.
[[bin]]
name = "rota-test-host"
path = "test-host/main.rs"
test = false
doc = false

[[test]]
name = "slot"
path = "test-host/tests/slot.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
toml = "=0.8.23"
tempfile = "=3.27.0"
fs2 = "=0.4.3"
libc = "=0.2.189"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "param", "process", "rand", "std", "termios", "time", "use-libc-auxv"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["mount", "pty"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
