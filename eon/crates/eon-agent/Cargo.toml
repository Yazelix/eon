[package]
name = "eon-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Picks which coding-agent subscription runs your next agent session"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yazelix/rota"
homepage = "https://github.com/Yazelix/rota"
readme = "README.md"
exclude = [".beads/"]
publish = false

[lib]
name = "rota"

[[bin]]
name = "rota"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
toml = "=0.8.23"
tempfile = "=3.27.0"
fs2 = "=0.4.3"
libc = "=0.2.189"
