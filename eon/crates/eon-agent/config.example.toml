# Replace all /PATH/TO values; percentages below are invented examples.
# Commands are argv arrays, never shell strings. Only whole arguments {prompt}
# and {cwd} are substituted. Backend order is admission order: each launch takes
# the first available backend, so list the account to use first at the top.
# A backend that sets limits declares its account and admits one launch per
# quota observation (its reader's observed_at).
# These commands do not request permission bypass. Custom bypass choices and their
# status labels are described in README.md#configuration.
# Anchors the state directory (its lock, admissions.json, runs, sessions, slots).
state_file = "/PATH/TO/state/last-pick"
log_file = "/PATH/TO/state/decisions.jsonl"
fallback = "main"
# Optional: keep popup resume on main's store; omitted means dynamic selection.
# popup_backend = "main"

# Headless runs (rota run) only, never checks: drop these inherited variables
# (a trailing * matches every name with that prefix), then set [run.env].
[run]
unset_env = ["DISPLAY", "WAYLAND_DISPLAY", "TERMINAL_*"]
[run.env]
TERMINAL_RUNTIME_DIR = "/PATH/TO/private-runtime"

[slots]
local_runner = [] # Host-only queued local command prefix; empty uses native admission.
count = 2
nice = 19
# During a transition, use the exact paths to existing flock files. List the
# extra slot last. The legacy directory requires these shared paths and supplies
# the old queue and policy files.
# lock_files = ["/PATH/TO/first.lock", "/PATH/TO/second.lock", "/PATH/TO/extra.lock"]
# legacy_dir = "/PATH/TO/legacy-state"
[slots.env]
CARGO_BUILD_JOBS = "6"
[[slots.classes]]
name = "nix"
match_argv = [["nix", "build"], ["nix", "profile"]]
slots = [2]
[[slots.classes]]
name = "run"
slots = [1, 2]
# [slots.boat] configures Eon's Boat build route, which only `eon agent` runs; see
# Eon's configuration reference.

[[backends]]
name = "alpha"
roles = ["implement", "review"]
guard = ["test", "-f", "/PATH/TO/guard"]
trusted_settings = "/PATH/TO/agy/settings.json"
[backends.commands]
medium = ["agy", "-i", "{prompt}", "--model", "MODEL-MEDIUM", "--sandbox"]
high = ["agy", "-i", "{prompt}", "--model", "MODEL-HIGH", "--sandbox"]
[backends.quota]
command = ["agy", "-p", "/usage"]
parser = "agy"
# Row group read from /usage (default below); a Gemini backend sets e.g. "Gemini Models".
# agy_group = "Claude and GPT models"
timeout_seconds = 60
# agy's usage output carries no observed_at, so this backend sets no limits:
# limits would hold every launch. The reading must still succeed.
[backends.cap]
max = 1
executable = "agy"
exclude_args = ["/usage"]

[[backends]]
name = "secondary"
account = "secondary"
# "lead" opts this account in to `launch --role lead`, which skips the quota gate.
roles = ["implement", "review", "lead"]
guard = ["test", "-f", "/PATH/TO/guard"]
required_files = ["/PATH/TO/secondary/.credentials.json"]
[backends.env]
CLAUDE_CONFIG_DIR = "/PATH/TO/secondary"
[backends.commands]
medium = ["claude", "{prompt}"]
high = ["claude", "{prompt}"]
[backends.quota]
command = ["python3", "-I", "/PATH/TO/usage.py", "/PATH/TO/secondary"]
parser = "claude_text"
# The reader prints e.g. "12 34 observed_at=1720000001000". An idle account
# reports None for its five-hour window: declare it absent so the week decides.
absent_windows = ["five_hour"]
# A backend with limits holds a reading older than max_age_seconds (default 600).
# max_age_seconds = 600
# Optional refresh runs only during a real launch, and only below the cap: after
# a failed read, or when the reading's observation already admitted a launch or
# is older than max_age_seconds.
# refresh = ["claude", "-p", "Reply with ok."]
[backends.cap]
max = 1
executable = "claude"
# If a wrapper changes argv[0], list the actual native binary paths:
# runtime_executables = ["/PATH/TO/.claude-wrapped"]
# For an interpreted CLI, use executable = "node" and script = "/PATH/TO/cli.js"
[backends.cap.env]
CLAUDE_CONFIG_DIR = "/PATH/TO/secondary"
[backends.limits.implement.max_used]
five_hour = 60
seven_day = 75
[backends.limits.review.max_used]
five_hour = 85
seven_day = 90

[[backends]]
name = "code"
account = "code"
roles = ["implement"]
guard = ["test", "-f", "/PATH/TO/guard"]
account_check = ["/PATH/TO/account-check"]
excluded_roots = ["/PATH/TO/other-account-projects"]
[backends.env]
CODEX_HOME = "/PATH/TO/codex"
# Workspace-write can deny Eon's socket and writes to external state; Codex may
# ask for approval or refuse. See README.md#sandboxed-slot-access for state access.
# TUI execution uses --no-daemon to retain this terminal's routing environment.
[backends.commands]
medium = ["codex", "--no-daemon", "-m", "MODEL", "-c", "model_reasoning_effort=high", "-s", "workspace-write", "-a", "on-request", "-C", "{cwd}", "{prompt}"]
high = ["codex", "--no-daemon", "-m", "MODEL", "-c", "model_reasoning_effort=xhigh", "-s", "workspace-write", "-a", "on-request", "-C", "{cwd}", "{prompt}"]
[backends.quota]
parser = "eon_codex"
# For standalone quota, replace the parser and add the command after upgrading shared readers.
# parser = "codexbar"
# command = ["codexbar", "usage", "--provider", "codex", "--source", "cli", "--format", "json", "--json-only"]
# With CodexBar, use five_hour and seven_day for named limits and absent_windows.
[backends.limits.implement]
strictly_above_min = true
# Eon windows are DURATIONm/INDEX; a key "10080m" covers every weekly window.
[backends.limits.implement.min_remaining]
"*" = 0
# Headless runs. {brief} {cwd} {report} {effort} may sit inside an argument;
# {add_dirs} is a whole argument that repeats add_dir once per --add-dir.
# A role listed here can run headless even when `roles` leaves it out.
[backends.run]
stdin = "brief"
efforts = ["medium", "high", "xhigh"]
default_effort = "high"
add_dir = ["--add-dir", "{dir}"]
[backends.run.commands]
implement = ["codex", "exec", "-m", "MODEL", "-c", "model_reasoning_effort={effort}", "-s", "workspace-write", "{add_dirs}", "-C", "{cwd}", "-o", "{report}", "-"]
review = ["codex", "exec", "-m", "MODEL", "-c", "model_reasoning_effort={effort}", "-s", "read-only", "-C", "{cwd}", "-o", "{report}", "-"]

[[backends]]
name = "open"
enabled = false
roles = ["implement", "review"]
allow_unknown_quota = true
guard = ["test", "-f", "/PATH/TO/guard"]
# Proxy-backed commands can also set a base URL here.
[backends.env]
PROVIDER_BASE_URL = "http://PROXY-HOST:PORT"
[backends.commands]
medium = ["opencode", "mini", "-m", "PROVIDER/MODEL#MEDIUM", "--prompt", "{prompt}"]
high = ["opencode", "mini", "-m", "PROVIDER/MODEL#HIGH", "--prompt", "{prompt}"]
[backends.cap]
max = 1
executable = "opencode"

[[backends]]
name = "main"
roles = []
unset_env = ["CLAUDE_CONFIG_DIR"]
guard = ["test", "-f", "/PATH/TO/guard"]
allow_unknown_quota = true
[backends.commands]
medium = ["claude", "{prompt}"]
high = ["claude", "{prompt}"]

# A project: retire's directories (NAME, NAME-target and NAME-work under agents_root), and a
# profile for agents launched or run in it. A launch selects it with --project alpha, or by
# running in repo (any subfolder or linked worktree of it). The popup never selects one.
[projects.alpha]
repo = "/PATH/TO/repo"
agents_root = "/PATH/TO/agents"
max = 2 # live implement and review agents in total; leads are not counted
[projects.alpha.done]
command = ["br", "show", "{bead}", "--json"]
pointers = ["/0/status", "/status"]
equals = "closed"
[projects.alpha.backends.code]
max = 1 # live agents of this project on backend code
[projects.alpha.roles.implement]
max = 1
guard = ["test", "-f", "/PATH/TO/machine-free"] # runs in the working directory; exit 0 admits
# Overlays add arguments by the command's executable, at its {overlay} argument, for every
# backend the role can pick that runs it. A role with overlays picks only those executables:
# [projects.alpha.roles.review.overlay]
# claude = ["--settings", "/PATH/TO/review-settings.json"]
# codex = []

[cleanup]
min_idle = "2h"
store_prefixes = ["/PATH/TO/store"]
