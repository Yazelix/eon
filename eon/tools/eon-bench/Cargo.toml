[package]
name = "eon-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# Signal actions, getrusage and Darwin's load average in src/sys.rs, plus a
# few errno and open-flag constants; already locked, and pinned as Orbit and
# Eon pin it.
libc = "=0.2.189"
# Safe syscall APIs for the benchmark's platform mechanisms.
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "net", "param", "process", "pty", "std", "system", "termios", "thread", "time"] }
# The `orbit` suite's client speaks Orbit's canonical wire format.
orbit-protocol = { path = "../../../orbit/crates/protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
# Benchmark-only virtual pointer; generated bindings own wheel/pixel/stop encoding.
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
