[package]
name = "mac-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "libc", "CGDirectDisplay", "CGEvent", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGWindow"] }
