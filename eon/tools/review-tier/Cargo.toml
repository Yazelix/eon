[package]
name = "review-tier"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# The tracker's JSONL export and the close record's JSON line.
serde_json = "=1.0.151"
# The close record's source digest and provisional configuration hash.
sha2 = "=0.10.9"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
