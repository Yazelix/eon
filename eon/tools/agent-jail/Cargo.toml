[package]
name = "agent-jail"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# Profiles' allowlists, manifests, records and the hook protocols.
serde_json = "=1.0.151"
# Pins, manifest and allowlist digests.
sha2 = "=0.10.9"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
# Peer credentials on the proxy socket, statvfs for the guard, waitpid for init.
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "mount", "net", "process", "std", "thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
