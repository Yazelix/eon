[package]
name = "yazelix-orbit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "=0.2.189"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "4466c0f45f51f964f86d1974a50502dbec7cb0de" }
orbit-protocol = { path = "crates/protocol" }
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "net", "param", "process", "pty", "std", "termios", "time"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
