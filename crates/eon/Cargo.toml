[package]
name = "eon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
eon-manifest = { path = "../eon-manifest" }
eon-workspace-protocol = { path = "../eon-workspace-protocol" }
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
