name: Publish Linux binary cache

on:
  push:
    branches: [edge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eon-cachix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # No paid private-repository runs or publishing from forks.
    if: github.repository == 'Yazelix/eon' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check publishing credential
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo '::error::Set the per-cache write token as the CACHIX_AUTH_TOKEN repository secret.'
            exit 1
          fi

      # The runner's root filesystem also holds /nix; drop preinstalled
      # toolchains Eon never uses so the package build has room.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/microsoft /usr/local/share/powershell
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: eon-yazelix
          # The push steps below select the exact cache roots.
          skipPush: true

      - name: Check Helix grammars without evaluator source fetches
        run: nix build --print-build-logs --no-link .#checks.x86_64-linux.helix-grammars

      - name: Build the retained Helix grammar sources
        run: nix build --no-link --print-out-paths .#packages.x86_64-linux.helix-grammar-sources > "$RUNNER_TEMP/helix-grammar-source-path"

      - name: Publish and retain Helix grammar sources
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cachix push eon-yazelix < "$RUNNER_TEMP/helix-grammar-source-path"
          cachix pin eon-yazelix "helix-grammar-sources-$(jq -r '.nodes.helix.locked.rev' flake.lock)" "$(cat "$RUNNER_TEMP/helix-grammar-source-path")" --keep-forever

      - name: Build the canonical Linux packages
        run: |
          nix build --print-build-logs --no-link --print-out-paths \
            .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.eonbase \
            .#packages.x86_64-linux.no-helix \
            .#packages.x86_64-linux.default.eonRust \
            .#checks.x86_64-linux.eon-tests > "$RUNNER_TEMP/eon-store-paths"

      - name: Check the no-Helix closure
        run: nix build --print-build-logs --no-link .#checks.x86_64-linux.no-helix-closure

      - name: Publish packages and shared build outputs
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push eon-yazelix < "$RUNNER_TEMP/eon-store-paths"
