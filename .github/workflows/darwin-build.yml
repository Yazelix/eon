name: Build Darwin package

on:
  push:
    branches: [edge]
    paths:
      - 'venus/**'
      - 'orbit/**'
      - 'runtime/**'
      - 'eon/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'components/**'
      - 'launcher/**'
      - 'LICENSE'
      - 'docs/CONFIGURATION.md'
      - 'docs/USAGE.md'
      - '.github/workflows/darwin-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eon-darwin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.check }}
    # No paid private-repository runs or runs from forks.
    if: github.repository == 'Yazelix/eon' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Measure the extra test leg on dispatches before enabling it on edge pushes.
        check: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["build","workspace-tests"]' || '["build"]') }}
    env:
      CARGO_BUILD_JOBS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Only unsandboxed Darwin builds are proved; eon-zuou owns sandboxed builds.
          extra_nix_config: sandbox = false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: eon-yazelix
          skipPush: true

      - name: Check runner and available disk
        run: |
          test "$(uname -m)" = arm64
          df -h / /nix
          printf 'CARGO_TARGET_DIR=%s/eon-darwin-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Evaluate Darwin checks without building
        if: matrix.check == 'build'
        run: >-
          nix eval --no-allow-import-from-derivation --json
          .#checks.aarch64-darwin
          --apply 'checks: builtins.mapAttrs (_: check: check.drvPath) checks'

      - name: Build the Darwin package
        if: matrix.check == 'build'
        run: nix build --print-build-logs --no-link .#packages.aarch64-darwin.default

      - name: Build release Orbit for workspace tests
        if: matrix.check == 'workspace-tests'
        id: release_orbit
        run: |
          nix develop -c cargo build --locked --release -p yazelix-orbit
          printf 'ORBIT_BIN=%s/release/yazelix-orbit\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

      - name: Collect workspace executable test failures
        if: matrix.check == 'workspace-tests'
        run: nix develop -c eon-test --workspace --cargo-profile release

      - name: Collect workspace doctest failures
        if: ${{ !cancelled() && matrix.check == 'workspace-tests' && steps.release_orbit.outcome == 'success' }}
        run: nix develop -c eon-test --doc --workspace --release --no-fail-fast

      - name: Collect ignored Eon and Runtime test failures
        if: ${{ !cancelled() && matrix.check == 'workspace-tests' && steps.release_orbit.outcome == 'success' }}
        run: nix develop -c eon-test -p eon -p eon-runtime --cargo-profile release --run-ignored only --test-threads 1

      - name: Check Orbit unsafe owners on Darwin
        if: ${{ !cancelled() && matrix.check == 'workspace-tests' }}
        run: nix develop -c cargo clippy --locked -p yazelix-orbit --all-targets -- -D warnings

      - name: Prepare Orbit real-PTY fixtures
        id: orbit_fixtures
        if: ${{ !cancelled() && matrix.check == 'workspace-tests' && steps.release_orbit.outcome == 'success' }}
        run: |
          nix develop -c bash -euo pipefail <<'FIXTURES'
          fixture_dir="$RUNNER_TEMP/orbit-proof-fixtures"
          mkdir -p "$fixture_dir/src"
          cp -R orbit/src/. "$fixture_dir/src"
          rustc --edition 2024 orbit/tools/boundary.rs -o "$fixture_dir/generate"
          { cat orbit/src/boundary.schema; echo 'flag 31 spare'; } > "$fixture_dir/spare.schema"
          "$fixture_dir/generate" "$fixture_dir/spare.schema" "$fixture_dir/src"
          (cd "$fixture_dir/src" && bun "$BEND_SOURCE_DIR/bend2/main.ts" main.bend -o "$fixture_dir/worker.c")
          "$BEND_CLANG" -std=c11 -O2 "$fixture_dir/worker.c" -lpthread -lm -o "$fixture_dir/mismatched-worker"

          # Match the package's legacy ncurses entry and hexadecimal directory alias.
          sed 's/use=xterm-256color,/pairs#0x7fff, use=xterm-256color,/' \
            orbit/terminfo/eon-darwin.terminfo > "$fixture_dir/eon.terminfo"
          tic -x -o "$fixture_dir/terminfo" "$fixture_dir/eon.terminfo"
          set -- "$fixture_dir"/terminfo/*/eon
          test "$#" = 1 && test -f "$1"
          mkdir -p "$CARGO_TARGET_DIR/share/terminfo/e"
          cp "$1" "$CARGO_TARGET_DIR/share/terminfo/e/eon"
          ln -sfn e "$CARGO_TARGET_DIR/share/terminfo/65"
          test "${BASH_VERSINFO[0]}" -ge 4
          printf 'MISMATCHED_WORKER=%s\nORBIT_BASH=%s\n' \
            "$fixture_dir/mismatched-worker" "$(command -v bash)" >> "$GITHUB_ENV"
          FIXTURES

      - name: Collect ignored Orbit real-PTY test failures
        if: ${{ !cancelled() && matrix.check == 'workspace-tests' && steps.release_orbit.outcome == 'success' && steps.orbit_fixtures.outcome == 'success' }}
        run: nix develop -c eon-test -p yazelix-orbit --test real_pty --cargo-profile release --run-ignored only --test-threads 1

      - name: Report remaining disk
        if: always()
        run: df -h / /nix
