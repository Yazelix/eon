name: macOS proof harness

on:
  workflow_dispatch:
    inputs:
      rev:
        description: Commit to prove (the dispatched branch's head when empty)
        required: false
        default: ''

permissions:
  contents: read

# One proof at a time; a newer dispatch replaces the running one.
concurrency:
  group: eon-mac-proof
  cancel-in-progress: true

jobs:
  prove:
    # No paid private-repository runs or runs from forks.
    if: github.repository == 'Yazelix/eon' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.rev }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Only unsandboxed Darwin builds are proved; eon-zuou owns sandboxed builds.
          extra_nix_config: sandbox = false

      # The run's limit leaves time inside the job's for setup and the upload.
      - name: Run the harness
        run: nix run .#mac-proof -- run --out "$RUNNER_TEMP/mac-proof" --timeout 320m

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mac-proof
          path: ${{ runner.temp }}/mac-proof
          retention-days: 14
